name: build & release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:        # ручной прогон без создания релиза

permissions:
  contents: write           # нужно, чтобы gh release смог создать релиз

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Сверить контрольные суммы архивов
        shell: pwsh
        run: |
          $bad = 0
          Get-Content deps/SHA256SUMS.txt | Where-Object { $_.Trim() } | ForEach-Object {
            $expected, $name = $_ -split '\s+', 2
            $name = $name.Trim()
            $actual = (Get-FileHash "deps/$name" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected.ToLower()) {
              Write-Host "::error::Не совпала сумма: $name"
              $bad++
            } else {
              Write-Host "OK  $name"
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Сверить версии зависимостей с константами в коде
        shell: pwsh
        run: |
          # Версия каждой зависимости живёт в трёх местах: константа в коде
          # (по ней пишется и сверяется маркер installed-version.txt), имя
          # архива в deps/ и ссылка на него в build.bat. Разъедутся молча:
          # сборка пройдёт, а обновление не доедет до тех, кто уже пользовался
          # программой, потому что маркер на их машине совпадёт со старым.
          $src = Get-Content ScrcpyForStreamer.cs -Raw
          $bad = 0

          $checks = @(
            @{ Name = 'scrcpy';    Const = 'Version';    Mask = 'scrcpy-win64-v*.zip';         Rx = '^scrcpy-win64-v(.+)\.zip$' },
            @{ Name = 'gnirehtet'; Const = 'NetVersion'; Mask = 'gnirehtet-rust-win64-v*.zip'; Rx = '^gnirehtet-rust-win64-v(.+)\.zip$' }
          )

          foreach ($c in $checks) {
            $before = $bad
            $m = [regex]::Match($src, ('public\s+const\s+string\s+{0}\s*=\s*"([^"]+)"' -f $c.Const))
            if (-not $m.Success) {
              Write-Host "::error::В ScrcpyForStreamer.cs не найдена константа Paths.$($c.Const)"
              $bad++; continue
            }
            $inCode = $m.Groups[1].Value

            $files = @(Get-ChildItem -Path deps -Filter $c.Mask)
            if ($files.Count -ne 1) {
              Write-Host "::error::В deps/ ожидался ровно один архив по маске $($c.Mask), найдено $($files.Count)"
              $bad++; continue
            }
            $file = $files[0]

            $n = [regex]::Match($file.Name, $c.Rx)
            if (-not $n.Success) {
              Write-Host "::error::Не разобрать версию из имени $($file.Name)"
              $bad++; continue
            }
            $inDeps = $n.Groups[1].Value

            if ($inCode -ne $inDeps) {
              Write-Host "::error::$($c.Name): в коде Paths.$($c.Const) = '$inCode', а в deps/ лежит '$inDeps'. Маркер версии не совпадёт — обновление молча не доедет до пользователей."
              $bad++
            }

            if (-not (Select-String -Path build.bat -SimpleMatch -Pattern $file.Name -Quiet)) {
              Write-Host "::error::$($c.Name): build.bat не ссылается на $($file.Name)"
              $bad++
            }

            if ($bad -eq $before) { Write-Host "OK  $($c.Name) $inCode" }
          }

          if ($bad -gt 0) { exit 1 }

      - name: Определить имя сборки
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            # Релиз: имя из тега, 1.0.2 -> v1_0_2
            $tag   = $env:GITHUB_REF -replace '^refs/tags/', ''
            $label = 'v' + ($tag -replace '\.', '_')
          } else {
            # Ручной прогон релизом не является. Имя нарочно не похоже на
            # номер версии: иначе такую сборку легко принять за выпуск 0.0.0.
            $tag   = ''
            $label = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "TAG=$tag"                                    | Out-File $env:GITHUB_ENV -Append
          "LABEL=$label"                                | Out-File $env:GITHUB_ENV -Append
          "OUT=dist/ScrcpyForStreamer-win64-$label.exe" | Out-File $env:GITHUB_ENV -Append
          Write-Host "сборка -> ScrcpyForStreamer-win64-$label.exe"

      - name: Собрать
        shell: cmd
        run: call build.bat

      - name: Проверить, что кириллица не поехала
        shell: pwsh
        run: |
          $exe = $env:OUT
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::Unicode.GetString($bytes)
          if ($text -notmatch 'Телефон') {
            Write-Host "::error::В exe нет корректных русских строк — проверь /codepage:65001"
            exit 1
          }
          Write-Host "кодировка в порядке, размер $([math]::Round($bytes.Length/1MB,2)) МБ"

      - name: Сохранить сборку как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyForStreamer-win64-${{ env.LABEL }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = $env:OUT
          $existing = gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $exe --clobber
          } else {
            gh release create $env:TAG $exe --title "v. $env:TAG" --generate-notes
          }
